<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="曙巡技术支持"><title>曙巡技术支持</title><style>:root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#1c1c1e;--muted:#62656d;--accent:#1478d4;--line:#e3e6eb}@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1b1e24;--text:#f3f4f7;--muted:#b0b5bf;--accent:#67afff;--line:#313640}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(760px,calc(100% - 32px));margin:48px auto 72px}h1{margin:0 0 8px;font-size:clamp(30px,7vw,42px);line-height:1.22}.subtitle,footer{color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0}h2{margin:0 0 12px;font-size:20px}p{margin:0}p+p{margin-top:12px}a{color:var(--accent)}.button{display:inline-block;margin-top:16px;padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}footer{margin-top:28px;font-size:14px}</style></head><body><main><header><h1>曙巡技术支持</h1><div class="subtitle">本地优先的健康记录与提醒工具</div></header><section><h2>使用帮助</h2><p>曙巡用于本地记录健康资料、用药计划、提醒、就诊与病历信息。它不提供诊断、治疗建议或紧急医疗服务。</p><p>如遇紧急健康情况，请联系当地急救服务或医疗专业人士。</p></section><section><h2>提交问题</h2><p>如遇到功能异常、备份恢复问题或有使用建议，请通过支持页面提交说明。请描述 App 版本、iOS 版本、设备型号和可复现的操作步骤。</p><p><strong>请勿提交姓名、联系方式、病历、检查单、药品清单、截图、完整备份文件或其他健康资料。</strong></p><a class="button" href="https://github.com/HOULABS/shuxun-privacy/issues/new">提交支持请求</a></section><section><h2>隐私政策</h2><p>了解曙巡如何处理本地资料和系统权限，请阅读<a href="index.html">隐私政策</a>。</p></section><footer>曙巡 · <a href="index.html">隐私政策</a></footer></main></body></html>
